<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}QA Portal{% endblock %} — Embedded QA</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .sidebar { min-height: 100vh; background: #1a1d23; }
    .sidebar .nav-link { color: #adb5bd; }
    .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: #2d3139; }
    .sidebar .brand { color: #fff; font-weight: 700; font-size: 1.1rem; }
    .status-badge-passed { background-color: #198754; }
    .status-badge-failed { background-color: #dc3545; }
    .status-badge-running { background-color: #0d6efd; }
    .status-badge-error { background-color: #fd7e14; }
    .card { border: none; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  </style>
</head>
<body>
<div class="container-fluid">
  <div class="row">
    <nav class="col-md-2 d-none d-md-block sidebar py-3 px-0">
      <div class="px-3 mb-4">
        <span class="brand"><i class="bi bi-cpu me-2"></i>QA Portal</span>
      </div>
      <ul class="nav flex-column">
        <li class="nav-item">
          <a class="nav-link px-3 {% block nav_dashboard %}{% endblock %}" href="{% url 'dashboard' %}">
            <i class="bi bi-grid me-2"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 {% block nav_trends %}{% endblock %}" href="{% url 'trends' %}">
            <i class="bi bi-graph-up me-2"></i>Trends
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link px-3 {% block nav_regressions %}{% endblock %}" href="{% url 'regressions' %}">
            <i class="bi bi-exclamation-triangle me-2"></i>Regressions
          </a>
        </li>
      </ul>
    </nav>
    <main class="col-md-10 ms-sm-auto px-4 py-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
